version: '3.8'

services:
  app:
    # Force amd64 platform for Apple Silicon Macs to enable building amd64 ISOs
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      platforms:
        - linux/amd64
    container_name: text-to-linux-os
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for development
      - ../backend:/app/backend
      - ../frontend:/app/frontend
      - ../templates:/app/templates

      # Persistent data volumes
      - ../cache:/app/cache
      - ../data:/app/data
      
      # Use a Docker volume for builds (not bind mount) to allow mknod operations
      - builds_volume:/app/builds
      
      # Mount a directory to copy finished ISOs to host
      - ../iso_output:/app/iso_output
    environment:
      - DATABASE_URL=sqlite:///./data/text-to-linux-os.db
      - MAX_ISO_SIZE_GB=3
      - BUILD_TIMEOUT_MINUTES=120
      - LOG_LEVEL=INFO
    restart: unless-stopped
    # Privileged mode needed for live-build
    privileged: true
    # Security options for debootstrap
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - MKNOD
    networks:
      - text-to-linux-network

networks:
  text-to-linux-network:
    driver: bridge

volumes:
  builds_volume:
    driver: local
