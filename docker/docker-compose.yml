services:
  app:
    # Force amd64 so Apple Silicon Macs build x86_64 ISOs (via Rosetta emulation)
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      platforms:
        - linux/amd64
    container_name: text-to-linux-os
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      # Source mounted for development convenience
      - ../backend:/app/backend
      - ../frontend:/app/frontend
      - ../templates:/app/templates

      # Persistent data
      - ../cache:/app/cache
      - ../data:/app/data

      # Builds live in a Docker volume (not a bind mount) so debootstrap can
      # mknod device nodes during the chroot bootstrap
      - builds_volume:/app/builds
    environment:
      - DATABASE_URL=sqlite:///./data/text-to-linux-os.db
      - MAX_ISO_SIZE_GB=3
      - BUILD_TIMEOUT_MINUTES=120
      - LOG_LEVEL=INFO
    restart: unless-stopped
    # live-build needs privileged chroot operations
    privileged: true
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
      - MKNOD

volumes:
  builds_volume:
    driver: local
